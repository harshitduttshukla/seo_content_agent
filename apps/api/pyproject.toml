[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "seo-content-api"
version = "0.0.0"
description = "Phase 1 SaaS foundation for the SEO Content Intelligence API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "beautifulsoup4>=4.12,<5",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "lxml>=5.2,<7",
  "pyjwt>=2.9,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
future-jobs = ["celery[redis]>=5.4,<6", "redis>=5,<6"]
future-storage = ["boto3>=1.35,<2"]
future-vector = ["pgvector>=0.3,<1"]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "testcontainers[postgres]>=4.8,<5",
]
# Provider SDKs, document parsers, crawling, evaluation, and CMS clients are
# future optional adapter dependencies and must be added only with their feature.

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires local infrastructure",
  "contract: verifies public schemas and tool contracts",
  "ai_eval: deterministic or explicitly enabled model evaluation",
]
