services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seo_content
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/001-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seo_content"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_MIGRATION_URL: postgresql+psycopg://postgres:postgres@postgres:5432/seo_content
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://seo_content_app:seo_content_app@postgres:5432/seo_content
      DATABASE_MIGRATION_URL: postgresql+psycopg://postgres:postgres@postgres:5432/seo_content
      AUTH_ISSUER: ${AUTH_ISSUER:-https://identity.example.com/}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-seo-content-api}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-https://identity.example.com/.well-known/jwks.json}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OIDC_ISSUER: ${AUTH_ISSUER:-https://identity.example.com/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_END_SESSION_ENDPOINT: ${OIDC_END_SESSION_ENDPOINT:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
